[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastllm-claude-code"
dynamic = ["version"]
description = "Claude Code API for fastllm"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kerem Turgutlu", email = "keremturgutlu@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ['python-fastllm>=0.0.44', 'fastclaude>=0.0.3', 'fasttransport>=0.0.2']

[project.urls]
Repository = "https://github.com/AnswerDotAI/fastllm-claude-code"
Documentation = "https://AnswerDotAI.github.io/fastllm-claude-code/"

[tool.chkstyle]
skip_paths = ["_modidx.py", "_proc"]

[project.entry-points.nbdev]
fastllm_claude_code = "fastllm_claude_code._modidx:d"

[project.entry-points."fastllm.apis"]
claude_code = "fastllm_claude_code.core"

[tool.setuptools.dynamic]
version = {attr = "fastllm_claude_code.__version__"}

[tool.setuptools.packages.find]
include = ["fastllm_claude_code"]

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']
